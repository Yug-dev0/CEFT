name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt ruff pytest-cov

      - name: Lint with Ruff (syntax & fatal errors)
        run: ruff check --select E9,F63,F7,F82 .

      - name: Run Pytest test suite
        run: pytest tests -v --durations=10

  docker:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ceft:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container & verify health
        run: |
          docker run -d --name ceft -p 8000:8000 ceft:ci
          echo "Waiting for Ceft API server to start..."
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health > /dev/null 2>&1; then
              echo "Server is healthy after $i attempt(s)"
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/health
          echo "Seeding sample demo data..."
          curl -fsS -X POST http://127.0.0.1:8000/demo/seed
          echo "Testing query endpoint..."
          curl -fsS -X POST http://127.0.0.1:8000/query -H "Content-Type: application/json" \
            -d '{"query": "How did the team fix the checkout timeout?", "limit": 3}' | head -c 400

      - name: Dump container logs on failure
        if: failure()
        run: docker logs ceft
